<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Wahoo DIY</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #000000;
      --card: #0c0c0c;
      --border: #262626;
      --text: #ffffff;
      --muted: #888888;
      --accent: #00e5ff;
      --danger: #ff2a2a;
      --warn: #ff9900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Pasek narzędzi */
    .toolbar {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: #050505;
      border-bottom: 1px solid var(--border);
    }
    button, .file-btn {
      flex: 1;
      background: #161616;
      color: var(--text);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
    }
    button.active { background: #003b44; border-color: var(--accent); color: var(--accent); }
    button.rec { background: #3a0000; border-color: var(--danger); color: #ff6b6b; }

    /* Pasek nawigacji (skręty GPX) */
    #nav-banner {
      display: none;
      background: #002b36;
      border-bottom: 1px solid var(--accent);
      padding: 8px 12px;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    /* Główny układ: dane + pasek radaru po prawej */
    .main-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Siatka Wahoo */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }
    .cell {
      background: var(--card);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cell.hero {
      grid-column: span 2;
      align-items: center;
      padding: 8px 10px;
    }
    .label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .val {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .hero .val { font-size: 68px; }
    .unit { font-size: 14px; color: var(--muted); margin-left: 3px; }

    /* Mapa */
    #map-wrap {
      flex: 1;
      position: relative;
      background: #000;
    }
    #map { width: 100%; height: 100%; background: #000; }
    .leaflet-control-attribution { display: none !important; }

    /* Pasek radaru Garmin Varia (prawa krawędź) */
    #radar-bar {
      width: 26px;
      background: #080808;
      border-left: 1px solid var(--border);
      position: relative;
      transition: background 0.15s;
    }
    #radar-bar.warn { background: #331d00; border-left-color: var(--warn); }
    #radar-bar.danger { background: #3d0000; border-left-color: var(--danger); }
    .car-dot {
      position: absolute;
      left: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #000;
      transform: translateY(50%);
    }
    .bike-icon {
      position: absolute;
      top: 6px;
      left: 5px;
      width: 16px;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="btn-start">Start</button>
    <button id="btn-hr">HR BLE</button>
    <button id="btn-varia">Varia</button>
    <label class="file-btn">GPX<input type="file" id="gpx-input" accept=".gpx" hidden /></label>
    <button id="btn-wake">Ekran</button>
  </div>

  <div id="nav-banner">
    <span id="nav-arrow">⬆</span> <span id="nav-text">Jedź prosto</span>
  </div>

  <div class="main-wrap">
    <div class="content">
      <div class="grid">
        <div class="cell hero">
          <div class="label">Prędkość <span id="gps-acc" style="color:#555">(GPS --)</span></div>
          <div><span class="val" id="speed">0.0</span><span class="unit">km/h</span></div>
        </div>
        <div class="cell">
          <div class="label">Tętno</div>
          <div><span class="val" id="hr">--</span><span class="unit">bpm</span></div>
        </div>
        <div class="cell">
          <div class="label">Dystans</div>
          <div><span class="val" id="dist">0.00</span><span class="unit">km</span></div>
        </div>
        <div class="cell">
          <div class="label">Czas jazdy</div>
          <div><span class="val" id="time">00:00</span></div>
        </div>
        <div class="cell">
          <div class="label">Przewyższenie</div>
          <div><span class="val" id="elev">0</span><span class="unit">m</span></div>
        </div>
      </div>

      <div id="map-wrap">
        <div id="map"></div>
      </div>
    </div>

    <!-- Pasek radaru Varia -->
    <div id="radar-bar">
      <div class="bike-icon"></div>
      <div id="radar-targets"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- 0. SYGNAŁ DŹWIĘKOWY (WEB AUDIO API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.25;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setTimeout(() => osc.stop(), dur);
    }

    // --- 1. MAPA LEAFLET (CARTO DARK MATTER) + CACHE OFFLINE ---
    const map = L.map('map', { zoomControl: false }).setView([52.23, 21.01], 14);
    const tileUrl = 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png';

    const CachedTileLayer = L.TileLayer.extend({
      createTile: function (coords, done) {
        const tile = document.createElement('img');
        const url = this.getTileUrl(coords);
        if ('caches' in window) {
          caches.open('wahoo-tiles-v1').then(async cache => {
            const cached = await cache.match(url);
            if (cached) {
              tile.src = URL.createObjectURL(await cached.blob());
              done(null, tile);
            } else {
              fetch(url).then(res => {
                if (res.ok) cache.put(url, res.clone());
                return res.blob();
              }).then(blob => {
                tile.src = URL.createObjectURL(blob);
                done(null, tile);
              }).catch(() => done(null, tile));
            }
          });
        } else {
          tile.src = url;
          done(null, tile);
        }
        return tile;
      }
    });
    new CachedTileLayer(tileUrl, { maxZoom: 19 }).addTo(map);

    const riderMarker = L.circleMarker([52.23, 21.01], {
      radius: 7, color: '#000', weight: 2, fillColor: '#00e5ff', fillOpacity: 1
    }).addTo(map);
    const rideTrack = L.polyline([], { color: '#00e5ff', weight: 4 }).addTo(map);
    let gpxLayer = null;

    // --- 2. IMPORT PLIKU GPX + WYKRYWANIE SKRĘTÓW ---
    let gpxPoints = [];
    let turnPoints = [];
    let alertedTurns = new Set();

    function bearing(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    document.getElementById('gpx-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      gpxPoints = [...xml.querySelectorAll('trkpt, rtept')].map(p => [
        parseFloat(p.getAttribute('lat')),
        parseFloat(p.getAttribute('lon'))
      ]);
      if (gpxPoints.length > 2) {
        if (gpxLayer) map.removeLayer(gpxLayer);
        gpxLayer = L.polyline(gpxPoints, { color: '#ff007f', weight: 5, opacity: 0.85 }).addTo(map);
        map.fitBounds(gpxLayer.getBounds());

        turnPoints = [];
        alertedTurns.clear();
        for (let i = 1; i < gpxPoints.length - 1; i++) {
          const b1 = bearing(gpxPoints[i - 1][0], gpxPoints[i - 1][1], gpxPoints[i][0], gpxPoints[i][1]);
          const b2 = bearing(gpxPoints[i][0], gpxPoints[i][1], gpxPoints[i + 1][0], gpxPoints[i + 1][1]);
          let diff = ((b2 - b1 + 540) % 360) - 180;
          if (Math.abs(diff) > 38) {
            turnPoints.push({
              idx: i,
              lat: gpxPoints[i][0],
              lon: gpxPoints[i][1],
              dir: diff > 0 ? 'W PRAWO ↱' : 'W LEWO ↰'
            });
          }
        }
        document.getElementById('nav-banner').style.display = 'block';
      }
    });

    // --- 3. GPS, LICZNIK JAZDY I NAWIGACJA PO SKRĘTACH ---
    let running = false, totalDist = 0, totalElev = 0, elapsedSec = 0;
    let lastPos = null, lastAlt = null, timerInt = null;

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000, toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    navigator.geolocation.watchPosition((pos) => {
      const { latitude, longitude, speed, altitude, accuracy } = pos.coords;
      document.getElementById('gps-acc').textContent = `(±${Math.round(accuracy)}m)`;
      const latlng = [latitude, longitude];
      riderMarker.setLatLng(latlng);
      map.panTo(latlng, { animate: false });

      // Sprawdzanie odległości do najbliższego zakrętu z GPX
      if (turnPoints.length > 0) {
        let nextTurn = null, minDist = Infinity;
        for (const t of turnPoints) {
          const d = haversine(latitude, longitude, t.lat, t.lon);
          if (d < minDist && d > 12) {
            minDist = d;
            nextTurn = t;
          }
        }
        if (nextTurn && minDist < 300) {
          document.getElementById('nav-arrow').textContent = `${Math.round(minDist)} m`;
          document.getElementById('nav-text').textContent = nextTurn.dir;
          if (minDist < 65 && !alertedTurns.has(nextTurn.idx)) {
            beep(1000, 150);
            alertedTurns.add(nextTurn.idx);
          }
        } else {
          document.getElementById('nav-arrow').textContent = '⬆';
          document.getElementById('nav-text').textContent = 'Jedź prosto';
        }
      }

      const kmh = speed && speed > 0.4 ? (speed * 3.6) : 0;
      document.getElementById('speed').textContent = kmh.toFixed(1);

      if (running && accuracy < 35) {
        if (lastPos) {
          const d = haversine(lastPos[0], lastPos[1], latitude, longitude);
          if (d > 3) {
            totalDist += d;
            document.getElementById('dist').textContent = (totalDist / 1000).toFixed(2);
            rideTrack.addLatLng(latlng);
            lastPos = latlng;
